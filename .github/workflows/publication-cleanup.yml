name: One-time public payload cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate public payloads without scan-specific pagination metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, csv, gzip, hashlib, io, json, re

          payloads = {
              'full': {
                  'kind': 'json',
                  'parts': [
                      'data/transport/v1-full-01.b64',
                      'data/transport/v1-full-x02.b64',
                      'data/transport/v1-full-x03.b64',
                  ],
              },
              'strict': {
                  'kind': 'json',
                  'parts': [
                      'data/transport/v1-strict-x01.b64',
                      'data/transport/v1-strict-x02.b64',
                      'data/transport/v1-strict-x03.b64',
                  ],
              },
              'noGeometry': {
                  'kind': 'csv',
                  'parts': ['data/transport/v1-noGeometry-x01.b64'],
              },
              'semantic': {
                  'kind': 'csv',
                  'parts': [
                      'data/transport/v1-semantic-x01.b64',
                      'data/transport/v1-semantic-02.b64',
                      'data/transport/v1-semantic-03.b64',
                      'data/transport/v1-semantic-04.b64',
                      'data/transport/v1-semantic-05.b64',
                  ],
              },
          }

          source_keys = {'Source', 'Sources', 'source', 'sources', 'surse'}

          def clean_source(value):
              text = str(value or '').strip()
              text = re.sub(r'\s*(?:[—–-]\s*)?https?://\S+', '', text, flags=re.I)
              text = re.sub(r'\s*;\s*PDF\s+p\.\s*[0-9][0-9\s,–—-]*(?=\.)', '', text, flags=re.I)
              text = re.sub(r'\s*;\s*PDF\s+p\.\s*[0-9][0-9\s,–—-]*\.?$', '', text, flags=re.I)
              text = re.sub(r'\s*[—–-]\s*$', '', text)
              text = re.sub(r'\s{2,}', ' ', text)
              return text.strip()

          def read_payload(parts):
              encoded = ''.join(
                  ''.join(Path(path).read_text(encoding='utf-8').split())
                  for path in parts
              )
              return gzip.decompress(base64.b64decode(encoded))

          def write_payload(parts, raw):
              gz = gzip.compress(raw, compresslevel=9, mtime=0)
              encoded = base64.b64encode(gz).decode('ascii')
              n = len(parts)
              base, extra = divmod(len(encoded), n)
              start = 0
              for i, path in enumerate(parts):
                  size = base + (1 if i < extra else 0)
                  Path(path).write_text(encoded[start:start+size], encoding='ascii')
                  start += size
              assert start == len(encoded)
              return gz

          manifest_rows = []

          for name, cfg in payloads.items():
              raw = read_payload(cfg['parts'])

              if cfg['kind'] == 'json':
                  data = json.loads(raw.decode('utf-8'))
                  for feature in data.get('features', []):
                      props = feature.get('properties') or {}
                      props.pop('PDFPages', None)
                      for key in list(props):
                          if key in source_keys and props[key] not in (None, ''):
                              props[key] = clean_source(props[key])
                  new_raw = json.dumps(data, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              else:
                  text = raw.decode('utf-8-sig')
                  first = text.splitlines()[0] if text.splitlines() else ''
                  delimiter = ';' if first.count(';') > first.count(',') else ','
                  reader = csv.DictReader(io.StringIO(text), delimiter=delimiter)
                  fields = [f for f in (reader.fieldnames or []) if f != 'PDFPages']
                  out = io.StringIO(newline='')
                  writer = csv.DictWriter(out, fieldnames=fields, delimiter=delimiter, lineterminator='\n')
                  writer.writeheader()
                  for row in reader:
                      row.pop('PDFPages', None)
                      for key in source_keys:
                          if key in row and row[key]:
                              row[key] = clean_source(row[key])
                      writer.writerow({k: row.get(k, '') for k in fields})
                  new_raw = out.getvalue().encode('utf-8')

              check = new_raw.decode('utf-8')
              assert 'PDFPages' not in check
              assert re.search(r'PDF\s+p\.', check, flags=re.I) is None

              gz = write_payload(cfg['parts'], new_raw)
              manifest_rows.append({
                  'payload': name,
                  'raw_bytes': len(new_raw),
                  'raw_sha256': hashlib.sha256(new_raw).hexdigest(),
                  'gzip_bytes': len(gz),
                  'gzip_sha256': hashlib.sha256(gz).hexdigest(),
              })

          with open('PUBLICATION_MANIFEST.csv', 'w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=['payload','raw_bytes','raw_sha256','gzip_bytes','gzip_sha256'])
              writer.writeheader()
              writer.writerows(manifest_rows)

          # One-time workflow: remove itself after producing the clean publication payloads.
          Path('.github/workflows/publication-cleanup.yml').unlink()
          PY

      - name: Validate repository publication surface
        shell: bash
        run: |
          test ! -e assets/pdf/weigand-1907-rumaenen-und-aromunen-in-bulgarien.pdf
          ! grep -R -n -I -E 'PDFPages|PDF[[:space:]]+p\.' --exclude-dir=.git --exclude='M9_MANIFEST.csv' .

      - name: Commit regenerated publication payloads
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Regenerate public payloads without scan-page metadata"
          git push origin HEAD:main
